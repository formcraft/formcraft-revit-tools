name: Build

# The checks run on the pilot PC (a self-hosted runner, docs/CI_RUNNER.md): the free hosted minutes for a private repo
# ran out on 14 Oct 2026. Set the repository variable CI_RUNNER to "hosted" to go back to GitHub's Windows runners.
# Branches are checked through their pull request (and on demand), so a push to a PR branch runs once, not twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run, so the PC isn't busy with outdated checks
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Windows PowerShell 5.1 is on every Windows PC; PowerShell 7 (pwsh) isn't on the pilot PC
defaults:
  run:
    shell: powershell

# On the self-hosted runner MSBuild's worker processes would outlive a job and keep files locked for the next one
# (CS2012 on TouchKit.Core.dll, 14 Oct), so every build starts its own workers and ends them
env:
  MSBUILDDISABLENODEREUSE: 1

jobs:
  shell:
    name: Pane shell (WPF, mock data)
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # .NET 8 builds the shell; .NET 10 runs the tests on Microsoft.Testing.Platform (global.json)
      # The pilot PC already has the .NET 8 and 10 SDKs; installing them again needs admin rights the runner hasn't got
      - uses: actions/setup-dotnet@v4
        if: ${{ vars.CI_RUNNER == 'hosted' }}
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the shell and its preview app
        id: preview
        run: dotnet build shell/Formcraft.Shell.Preview/Formcraft.Shell.Preview.csproj -c Release
      - name: Build the shell for Revit 2020-2024 (net48)
        run: dotnet build shell/Formcraft.Shell/Formcraft.Shell.csproj -c Release -f net48
      - name: Shell tests (theme, kit styles, services)
        run: dotnet test --project tests/shell/Formcraft.Shell.Tests.csproj -c Release --report-trx --results-directory "${{ github.workspace }}/test-results"
      - name: Flow touch engine tests (gestures, settings)
        run: dotnet test --project tests/touch/TouchKit.Core.Tests.csproj -c Release
      # The next steps run even when tests fail, so a failure shows its test name, message and the screens
      - uses: actions/upload-artifact@v4
        continue-on-error: true # artifact storage is billed; a full quota mustn't fail the checks
        if: ${{ !cancelled() }}
        with:
          name: shell-test-results
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
      - name: Kit gallery snapshots (light and dark, 440 and 360 px)
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        run: shell/Formcraft.Shell.Preview/bin/Release/net8.0-windows/Formcraft.Shell.Preview.exe --snapshot "${{ github.workspace }}/snapshots" | Out-Host
      - uses: actions/upload-artifact@v4
        continue-on-error: true # artifact storage is billed; a full quota mustn't fail the checks
        if: ${{ !cancelled() && steps.preview.outcome == 'success' }}
        with:
          name: kit-snapshots
          path: snapshots
          retention-days: 3
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: shell-preview
          path: shell/Formcraft.Shell.Preview/bin/Release/net8.0-windows

  server:
    name: MCP server (TypeScript) and guard tests
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run build
      - working-directory: server
        run: npm test

  addin:
    name: Add-in and command set (Revit 2025)
    runs-on: ${{ vars.CI_RUNNER == 'hosted' && 'windows-latest' || fromJSON('["self-hosted", "Windows", "X64"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The pilot PC already has the .NET 8 and 10 SDKs; installing them again needs admin rights the runner hasn't got
      - uses: actions/setup-dotnet@v4
        if: ${{ vars.CI_RUNNER == 'hosted' }}
        with:
          dotnet-version: 8.0.x
      - name: Build plugin and command set
        # One build process: in parallel, two projects can write the same TouchKit.Core.dll at once.
        # Compiler errors are also written as annotations, so they can be read through the API (job logs can't be
        # fetched from every client).
        run: |
          dotnet build mcp-servers-for-revit.sln -c "Release R25" -m:1 -nodeReuse:false 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Select-String -Path build.log -Pattern ': error [A-Z]+[0-9]+' | Select-Object -ExpandProperty Line -Unique | Select-Object -First 30 | ForEach-Object { Write-Output "::error::$_" }
          exit $code

  # After a merge to main, on the pilot PC only: build and stage for the Formcraft Updater (CLAUDE.md "After every
  # merge"). The runner's service account can't write to the person's profile, so it drops the build in
  # %ProgramData%\Formcraft\Staging\next; the updater (scripts/fmc-update.ps1) moves it in and installs it when Revit
  # is closed. It never closes Revit.
  stage:
    name: Stage main for the updater
    needs: [shell, server, addin]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CI_RUNNER != 'hosted' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin and command set
        run: dotnet build mcp-servers-for-revit.sln -c "Release R25" -m:1 -nodeReuse:false
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm run build
      # The connectors build against the installed Robot and Navisworks 2025, so only where they are; the stage script
      # carries whichever were built (Robot beside the server, the Navisworks add-in for when Navisworks is closed)
      - name: Build the Robot and Navisworks connectors (where installed)
        run: |
          if (Test-Path 'C:\Program Files\Autodesk\Robot Structural Analysis Professional 2025\Exe\Interop.RobotOM.dll') { dotnet build connectors/robot/FormcraftRobot.csproj -c Release -nodeReuse:false; if ($LASTEXITCODE) { exit $LASTEXITCODE } } else { 'Robot 2025 not installed: no Robot connector' }
          if (Test-Path 'C:\Program Files\Autodesk\Navisworks Manage 2025\Autodesk.Navisworks.Api.dll') { dotnet build connectors/navisworks/FormcraftNavis.csproj -c Release -nodeReuse:false; if ($LASTEXITCODE) { exit $LASTEXITCODE } } else { 'Navisworks Manage 2025 not installed: no Navisworks add-in' }
      - name: Stage
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/fmc-stage.ps1 -Target "$env:ProgramData\Formcraft\Staging\next"

